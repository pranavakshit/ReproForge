[package]
name = "reproforge_iced_skia_bench"
version = "0.1.0"
edition = "2021"

[dependencies]
iced = { version = "0.14.0", default-features = false, features = ["tiny-skia", "thread-pool"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
