[package]
name = "reproforge_desktop"
version = "0.1.0"
edition = "2021"

[dependencies]
slint = { version = "1.19.0", features = ["renderer-femtovg", "renderer-software", "compat-1-2"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[build-dependencies]
slint-build = "1.19.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
